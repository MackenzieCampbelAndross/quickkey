[package]
name = "quickkey-native"
version = "0.1.0"
description = "QuickKey Desktop Launcher Native Rust Backend"
edition = "2021"

[lib]
name = "quickkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = ["Win32_System_Shutdown", "Win32_UI_WindowsAndMessaging"] }
